! Configuration du switch SW1
! A adapter au modele et aux noms d'interfaces avant deploiement.
! Reference SITE_B_Schema.pdf v1.1. Base IOS a appliquer en console.
! SVI VLAN99 active seulement si port 23 et lien VLAN99 operationnels.
! ACL inter-VLAN complete a finaliser selon R1_FW1.md et Dossier_reseau.md.
! Preparer SSH/AAA et cles avant activation des VTY. Sauvegarder apres recette.
enable
configure terminal
hostname SW1
no ip domain-lookup
ip routing

vlan 10
 name DIRECTION
exit
interface range GigabitEthernet1/0/1 - 4
 description ACCES-DIRECTION
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit
interface Vlan10
 ip address 172.16.1.1 255.255.255.224
 no shutdown
exit

vlan 20
 name COMPTABILITE
exit
interface range GigabitEthernet1/0/5 - 9
 description ACCES-COMPTABILITE
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit
interface Vlan20
 ip address 172.16.1.33 255.255.255.224
 no shutdown
exit

vlan 30
 name WIFI
exit
interface range GigabitEthernet1/0/10 - 14
 description ACCES-WIFI
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit
interface Vlan30
 ip address 172.16.1.65 255.255.255.224
 ip helper-address 172.16.1.131
 no shutdown
exit

vlan 40
 name ADMINISTRATION
exit
interface range GigabitEthernet1/0/15 - 18
 description ACCES-ADMINISTRATION
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
exit
interface Vlan40
 ip address 172.16.1.97 255.255.255.224
 no shutdown
exit

vlan 50
 name SERVEURS
exit
interface range GigabitEthernet1/0/19 - 22
 description ACCES-SERVEURS
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 no shutdown
exit
interface Vlan50
 ip address 172.16.1.129 255.255.255.224
 no shutdown
exit

vlan 99
 name MANAGEMENT
exit
interface GigabitEthernet1/0/23
 description ACCES-MANAGEMENT-VLAN99
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 no shutdown
exit
interface Vlan99
 ip address 172.16.1.161 255.255.255.224
 no shutdown
exit

interface GigabitEthernet1/0/24
 description TRANSIT-FW1-E0-2
 no switchport
 ip address 172.16.1.198 255.255.255.252
 no shutdown
exit

ip route 0.0.0.0 0.0.0.0 172.16.1.197

interface range GigabitEthernet1/0/2 - 4
 description RESERVE-NON-RACCORDEE
 shutdown
exit

interface range GigabitEthernet1/0/6 - 9
 description RESERVE-NON-RACCORDEE
 shutdown
exit

interface range GigabitEthernet1/0/11 - 14
 description RESERVE-NON-RACCORDEE
 shutdown
exit

interface range GigabitEthernet1/0/16 - 18
 description RESERVE-NON-RACCORDEE
 shutdown
exit

interface range GigabitEthernet1/0/19 - 21
 description RESERVE-NON-RACCORDEE
 shutdown
exit

ip access-list extended WIFI_IN
 10 remark DHCP initial et renouvellement
 20 permit udp host 0.0.0.0 eq 68 host 255.255.255.255 eq 67
 30 permit udp 172.16.1.64 0.0.0.31 eq 68 host 255.255.255.255 eq 67
 40 permit udp 172.16.1.64 0.0.0.31 eq 68 host 172.16.1.131 eq 67
 50 remark DNS interne
 60 permit udp 172.16.1.64 0.0.0.31 host 172.16.1.131 eq 53
 70 permit tcp 172.16.1.64 0.0.0.31 host 172.16.1.131 eq 53
 80 remark Diagnostic passerelle et retours AP1 vers PC03
 90 permit icmp 172.16.1.64 0.0.0.31 host 172.16.1.65 echo
 100 permit tcp host 172.16.1.66 host 172.16.1.98 established
 110 permit icmp host 172.16.1.66 host 172.16.1.98 echo-reply
 120 remark Refus des autres destinations privees
 130 deny ip 172.16.1.64 0.0.0.31 10.0.0.0 0.255.255.255 log
 140 deny ip 172.16.1.64 0.0.0.31 172.16.0.0 0.15.255.255 log
 150 deny ip 172.16.1.64 0.0.0.31 192.168.0.0 0.0.255.255 log
 160 remark HTTPS Internet - HTTP ferme sauf besoin valide
 180 permit tcp 172.16.1.64 0.0.0.31 any eq 443
 999 deny ip any any log
exit
interface Vlan30
 ip access-group WIFI_IN in
exit
ip access-list standard MGMT_VTY
 10 permit host 172.16.1.98
 20 permit host 172.16.1.162
 99 deny any log
exit
! Plage IOS usuelle : adapter au nombre de VTY du modele.
line vty 0 15
 access-class MGMT_VTY in
 transport input ssh
exit
! Toute VTY supplementaire doit recevoir la meme restriction.
! Aucun mot de passe ni compte local fictif dans ce fichier.
end
